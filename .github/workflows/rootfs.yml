name: rootfs

on:
  workflow_dispatch:
    inputs:
      azurpilot_ref:
        description: AzurPilot dev 的 commit SHA；留空使用已验证基线
        required: false
        type: string
      reuse_rootfs_run_id:
        description: 已通过的 rootfs Actions run ID；填写后只重建 APK
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.reuse_rootfs_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build rootfs
        env:
          AZURPILOT_REF: ${{ inputs.azurpilot_ref || 'b8f91d885e6d725aa800265178fdc2df631a6154' }}
        run: bash rootfs/build/build-azurpilot.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
            dist/runtime.tar.xz
            dist/latest.json
          retention-days: 14

  apk:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.reuse_rootfs_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .tmp/azurpilot-artifact
          run-id: ${{ inputs.reuse_rootfs_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle runtime and build debug APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.tmp/gradle-home
        run: |
          mkdir -p app/app/src/main/assets/rootfs
          cp .tmp/azurpilot-artifact/rootfs.tar.xz app/app/src/main/assets/rootfs/
          cp .tmp/azurpilot-artifact/BUILD_MANIFEST app/app/src/main/assets/rootfs/
          cd app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: azurpilot-android-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
