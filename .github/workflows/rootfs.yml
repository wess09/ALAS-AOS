name: AzurPilot Android build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      azurpilot_ref:
        description: AzurPilot dev commit SHA; blank uses current dev head
        required: false
        type: string
      reuse_rootfs_run_id:
        description: Existing successful rootfs run ID; blank rebuilds everything
        required: false
        type: string
      publish_update:
        description: Publish APK to the in-app dev update channel
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '7 * * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: azurpilot-android-update
  # rootfs 构建可能超过一小时；下一次整点任务不能取消正在构建的任务。
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      publish: ${{ steps.resolve.outputs.publish }}
      signing_ready: ${{ steps.resolve.outputs.signing_ready }}
      runtime_commit_time: ${{ steps.resolve.outputs.runtime_commit_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_REF: ${{ inputs.azurpilot_ref }}
          INPUT_PUBLISH: ${{ inputs.publish_update }}
          EVENT_NAME: ${{ github.event_name }}
          SIGNING_KEY: ${{ secrets.AZURPILOT_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.AZURPILOT_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.AZURPILOT_ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AZURPILOT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$(git ls-remote https://github.com/wess09/AzurPilot.git refs/heads/dev | awk '{print $1}')"
          fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid AzurPilot ref: $ref" >&2; exit 1; }
          publish=false
          if [[ "$EVENT_NAME" != workflow_dispatch || "$INPUT_PUBLISH" == true ]]; then publish=true; fi
          signing_ready=false
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" && -n "$SIGNING_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            signing_ready=true
          elif [[ "$publish" == true ]]; then
            echo 'Release signing secrets are incomplete: build debug APK and publish rootfs only.'
          fi
          # push 与每小时 schedule 都完整构建；不能只按上游 commit 跳过，宿主代码也会变化。
          should_build=true
          # 版本号由 Gradle 统一算：max(本仓提交时间, 上游提交时间)。这里只负责把上游那半取回来。
          runtime_commit_time="$(curl -fsSL "https://api.github.com/repos/wess09/AzurPilot/commits/$ref" 2>/dev/null | jq -r '.commit.committer.date' 2>/dev/null || true)"
          runtime_commit_time="$(date -u -d "$runtime_commit_time" +%s 2>/dev/null || echo 0)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "signing_ready=$signing_ready" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "runtime_commit_time=$runtime_commit_time" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.should_build == 'true' && inputs.reuse_rootfs_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runner info
        run: |
          uname -m
          nproc
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Build rootfs
        env:
          AZURPILOT_REF: ${{ needs.resolve.outputs.ref }}
        run: bash rootfs/build/build-azurpilot.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
          retention-days: 14

  apk:
    needs: [resolve, build]
    outputs:
      # 版本号由 Gradle 从代码算出，这里从构建产物元数据读回，供发布步骤写进更新清单
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && (needs.build.result == 'success' || inputs.reuse_rootfs_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本名第三段取本仓提交数：浅克隆下 `git rev-list --count HEAD` 只回 1，
          # 会让 CI 与本地算出不同的版本号，必须取全量历史
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .tmp/azurpilot-artifact
          run-id: ${{ inputs.reuse_rootfs_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing key
        if: ${{ needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.signing_ready == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.AZURPILOT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'AZURPILOT_ANDROID_KEYSTORE_BASE64 is missing' >&2; exit 1; }
          mkdir -p .tmp/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .tmp/signing/azurpilot.jks
      - name: Bundle runtime and build APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.tmp/gradle-home
          APP_RUNTIME_COMMIT: ${{ needs.resolve.outputs.ref }}
          APP_RUNTIME_COMMIT_TIME: ${{ needs.resolve.outputs.runtime_commit_time }}
          KEYSTORE_PATH: ${{ github.workspace }}/.tmp/signing/azurpilot.jks
          KEYSTORE_PASSWORD: ${{ secrets.AZURPILOT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZURPILOT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AZURPILOT_ANDROID_KEY_PASSWORD }}
          SIGNING_READY: ${{ needs.resolve.outputs.signing_ready }}
        run: |
          mkdir -p app/app/src/main/assets/rootfs
          cp .tmp/azurpilot-artifact/rootfs.tar.xz app/app/src/main/assets/rootfs/
          cp .tmp/azurpilot-artifact/BUILD_MANIFEST app/app/src/main/assets/rootfs/
          cd app
          chmod +x gradlew
          if [[ "$SIGNING_READY" == true ]]; then
            ./gradlew :app:assembleRelease --console=plain --stacktrace
          else
            unset KEYSTORE_PATH KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            ./gradlew :app:assembleDebug --console=plain --stacktrace
          fi
      - name: Read version from build output
        id: version
        run: |
          set -euo pipefail
          meta="$(find app/app/build/outputs/apk -name output-metadata.json -print -quit)"
          test -n "$meta"
          code="$(jq -r '.elements[0].versionCode' "$meta")"
          name="$(jq -r '.elements[0].versionName' "$meta")"
          test -n "$code" && test "$code" != null
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "APK version: $name ($code)"
      - uses: actions/upload-artifact@v4
        with:
          name: azurpilot-android-apk
          path: app/app/build/outputs/apk/**/*.apk
          retention-days: 14

  publish:
    needs: [resolve, apk]
    if: ${{ needs.resolve.outputs.publish == 'true' && needs.apk.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurpilot-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .tmp/publish-rootfs
          run-id: ${{ inputs.reuse_rootfs_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish in-app update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AP_REF: ${{ needs.resolve.outputs.ref }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
          SIGNING_READY: ${{ needs.resolve.outputs.signing_ready }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_READY" == true ]]; then
            apk="$(find dist -type f -name '*release*.apk' -print -quit)"
            test -n "$apk"
            asset="AzurPilot-Android-${VERSION_NAME}.apk"
            cp "$apk" "$asset"
            sha="$(sha256sum "$asset" | awk '{print $1}')"
            size="$(stat -c %s "$asset")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/azurpilot-android-latest/$asset"
          fi
          cp .tmp/publish-rootfs/rootfs.tar.xz rootfs.tar.xz
          cp .tmp/publish-rootfs/BUILD_MANIFEST BUILD_MANIFEST
          rootfs_version="$(jq -r '.rootfs_version' BUILD_MANIFEST)"
          test -n "$rootfs_version" && test "$rootfs_version" != null
          rootfs_sha="$(sha256sum rootfs.tar.xz | awk '{print $1}')"
          rootfs_size="$(stat -c %s rootfs.tar.xz)"
          rootfs_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/azurpilot-android-latest/rootfs.tar.xz"
          jq -n --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" \
            --arg azurpilotCommit "$AP_REF" --arg rootfsVersion "$rootfs_version" \
            --arg rootfsUrl "$rootfs_url" --arg rootfsSha256 "$rootfs_sha" \
            --argjson rootfsSize "$rootfs_size" \
            '{versionCode:$versionCode,versionName:$versionName,azurpilotCommit:$azurpilotCommit,rootfsVersion:$rootfsVersion,rootfsUrl:$rootfsUrl,rootfsSha256:$rootfsSha256,rootfsSize:$rootfsSize}' \
            > latest.json
          if [[ "$SIGNING_READY" == true ]]; then
            jq --arg apkUrl "$url" --arg apkSha256 "$sha" --argjson apkSize "$size" \
              '. + {apkUrl:$apkUrl,apkSha256:$apkSha256,apkSize:$apkSize}' latest.json > latest.tmp.json
            mv latest.tmp.json latest.json
          fi
          gh release view azurpilot-android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create azurpilot-android-latest --repo "$GITHUB_REPOSITORY" --draft \
              --title 'AzurPilot Android 自动构建' \
              --notes '每小时及 main 更新时自动构建。包含 rootfs 和校验清单；配置正式签名后同时提供 APK。'
          assets=(rootfs.tar.xz BUILD_MANIFEST latest.json)
          if [[ "$SIGNING_READY" == true ]]; then assets+=("$asset"); fi
          gh release upload azurpilot-android-latest "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit azurpilot-android-latest --repo "$GITHUB_REPOSITORY" --draft=false --latest
