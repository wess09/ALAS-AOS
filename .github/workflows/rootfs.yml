name: rootfs

on:
  workflow_dispatch:
    inputs:
      azurpilot_ref:
        description: AzurPilot master 的 commit SHA；留空使用已验证基线
        required: false
        type: string
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/rootfs.yml'

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build rootfs
        env:
          AZURPILOT_REF: ${{ inputs.azurpilot_ref || '88c4a41cea8aeaeafa7536db510d383ebba7213b' }}
        run: bash rootfs/build/build-azurpilot.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
            dist/runtime.tar.xz
            dist/latest.json
          retention-days: 14

  apk:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .tmp/azurpilot-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle runtime and build debug APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.tmp/gradle-home
        run: |
          mkdir -p app/app/src/main/assets/rootfs
          cp .tmp/azurpilot-artifact/rootfs.tar.xz app/app/src/main/assets/rootfs/
          cp .tmp/azurpilot-artifact/BUILD_MANIFEST app/app/src/main/assets/rootfs/
          cd app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: azurpilot-android-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
